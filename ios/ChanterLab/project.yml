name: ChanterLab
options:
  bundleIdPrefix: com.alwaysdobetterllc
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: S49ND6S2YR
    CODE_SIGN_STYLE: Automatic
targets:
  ChanterLab:
    type: application
    platform: iOS
    sources: [Sources, Assets.xcassets, Resources]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: ChanterLab
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIAppFonts: [Bravura.otf]
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSMicrophoneUsageDescription: ChanterLab listens to your voice to show how close you are to the target pitch.
        UIBackgroundModes: [audio]
        # Debug builds can load a LAN dev server (CHANTERLAB_URL); production is https only.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alwaysdobetterllc.chanterlab
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: Sources/ChanterLab-Bridging-Header.h
        # Rust pitch detector, built by ios/build_core.sh.
        "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]": $(PROJECT_DIR)/Core/iphoneos
        "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]": $(PROJECT_DIR)/Core/iphonesimulator
        OTHER_LDFLAGS: -lchanterlab_core
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
