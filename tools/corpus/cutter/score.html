<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Score boundary picker</title>
<style>
:root{--bg:#12100e;--panel:#1c1916;--line:#2f2a25;--ink:#efe7dc;--dim:#9c9086;
  --gold:#d8a24a;--red:#c65b4e;--green:#6ea45f;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
header{position:sticky;top:0;z-index:6;background:var(--panel);
  border-bottom:1px solid var(--line);padding:8px 10px}
select,button,input{font:inherit;color:var(--ink);background:#241f1b;
  border:1px solid var(--line);border-radius:9px;padding:9px 12px}
select,input{width:100%}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button.on{background:var(--gold);color:#1a1512;border-color:var(--gold);font-weight:600}
button[disabled]{opacity:.38}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
.row button{flex:1}
#who{font-size:14px;color:var(--gold);margin-top:4px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#msg{font-size:13px;color:var(--dim);min-height:18px}
#wf{position:relative;height:64px;margin:6px 0 2px;background:#0d0b0a;
  border:1px solid var(--line);border-radius:8px;overflow:hidden;touch-action:none}
#wf canvas{position:absolute;inset:0;width:100%;height:100%}
#tl{font-variant-numeric:tabular-nums;font-size:13px;color:var(--dim)}
.rates button{flex:1;min-width:40px;padding:7px 2px;font-size:14px}
.lane-tag{font-size:11px;color:var(--dim);text-transform:uppercase;
  letter-spacing:.4px;border:1px solid var(--line);border-radius:5px;padding:1px 5px}
main{padding:6px 0 96px}
.pg{position:relative;margin:0 auto 10px;max-width:1100px}
.pg img{display:block;width:100%;height:auto;border-radius:6px}
.pg canvas{position:absolute;inset:0;width:100%;height:100%}
.pgno{position:absolute;top:4px;right:8px;font-size:12px;color:#000;
  background:rgba(216,162,74,.85);border-radius:4px;padding:1px 6px}
footer{position:fixed;left:0;right:0;bottom:0;background:var(--panel);
  border-top:1px solid var(--line);padding:8px 10px;
  padding-bottom:calc(8px + env(safe-area-inset-bottom));z-index:7}
#list{max-height:34vh;overflow:auto;padding:0 10px}
.h{display:flex;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--line);
  border-radius:9px;margin-bottom:5px;background:var(--panel)}
.h.sel{border-color:var(--gold);background:#241d14}
.h.done{border-color:#3c5b34}
.h .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.h .t{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
</style>

<header>
  <select id="wd"></select>
  <div id="who"></div>
  <div class="row">
    <button id="mode0" class="on">tap = START</button>
    <button id="mode1">tap = END</button>
  </div>
  <div id="wf"><canvas></canvas></div>
  <div class="row">
    <button id="pp">Play</button>
    <button id="back">&#8630;3s</button>
    <button id="fwd">3s&#8631;</button>
    <button id="setI" title="mark where the held νε ends">νε&#9679;</button>
    <span id="tl">0:00</span>
  </div>
  <div class="row rates" id="rates"></div>
  <div id="msg"></div>
</header>
<audio id="a" preload="metadata" playsinline webkit-playsinline></audio>

<div id="list"></div>
<main id="pages"></main>

<footer>
  <input id="lab" placeholder="label — e.g. Θεὸς Κύριος (apichima on νε first)"
         autocapitalize="off" autocomplete="off" spellcheck="false">
  <div class="row">
    <button id="prev">&#8593; prev</button>
    <button id="next">&#8595; next</button>
    <button id="goto">show span</button>
    <button id="clr">clear</button>
    <button id="save">Save</button>
  </div>
</footer>

<script>
const $ = s => document.querySelector(s);
let D = null, wd = null, rows = [], sel = 0, mode = 0;
const A = $('#a');
let PK = null, PPS = 20, rate = 1, stopAt = null;

const fmt = t => { const m = Math.floor(t / 60), x = t - m * 60;
  return m + ':' + (x < 10 ? '0' : '') + x.toFixed(1); };

const RATES = [0.5, 1, 2, 4];
function drawRates() {
  $('#rates').innerHTML = '';
  RATES.forEach(r => {
    const b = document.createElement('button');
    b.textContent = r + 'x'; if (r === rate) b.className = 'on';
    b.onclick = () => { rate = r; applyRate(); drawRates(); };
    $('#rates').append(b);
  });
}
function applyRate() {
  try { A.preservesPitch = A.mozPreservesPitch = A.webkitPreservesPitch = true; } catch (e) {}
  try { A.playbackRate = rate; } catch (e) {}
}
function playSpan() {
  const r = rows[sel];
  if (!r || r.t0 == null) return msg('this row has no audio span');
  A.currentTime = r.t0; stopAt = r.t1; applyRate();
  const p = A.play();
  if (p && p.catch) p.catch(e => msg('✗ ' + e.message));
}
A.addEventListener('timeupdate', () => {
  $('#tl').textContent = fmt(A.currentTime);
  if (stopAt != null && A.currentTime >= stopAt) { A.pause(); stopAt = null; }
  drawWave();
});
A.addEventListener('play', () => $('#pp').textContent = 'Pause');
A.addEventListener('pause', () => $('#pp').textContent = 'Play');
$('#pp').onclick = () => { if (A.paused) playSpan(); else A.pause(); };
// The apichima mark belongs to the audio span, so it is patched on the span
// rather than saved with the score bounds.
$('#setI').onclick = async () => {
  const r = rows[sel];
  if (!r || r.t0 == null) return msg('this row has no audio span');
  const t = +A.currentTime.toFixed(3);
  if (t < r.t0 || t > r.t1) return msg('playhead is outside this span');
  const val = (r.t_in != null && Math.abs(r.t_in - t) < 0.05) ? null : t;
  try {
    const res = await fetch('/api/span', { method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ workdir: wd, hymn: r.name, t_in: val }) });
    const j = await res.json();
    if (!res.ok) return msg('✗ ' + (j.error || res.status));
    r.t_in = j.t_in;
    msg(j.t_in == null ? 'apichima mark cleared'
                       : 'apichima ends ' + fmt(j.t_in) + ' — hymn starts there');
    drawWave(); render();
  } catch (e) { msg('✗ ' + e.message); }
};
$('#back').onclick = () => A.currentTime = Math.max(0, A.currentTime - 3);
$('#fwd').onclick = () => A.currentTime = A.currentTime + 3;

// Waveform of the SELECTED span only -- this is a picker for one hymn at a
// time, so the whole tape is noise here. Tap or drag to seek inside it.
const wcv = $('#wf canvas');
function drawWave() {
  const cx = wcv.getContext('2d');
  const W = wcv.width = wcv.clientWidth * devicePixelRatio;
  const H = wcv.height = wcv.clientHeight * devicePixelRatio;
  cx.clearRect(0, 0, W, H);
  const r = rows[sel];
  if (!r || r.t0 == null) return;
  const a = r.t0, b = r.t1;
  if (PK) {
    const i0 = Math.floor(a * PPS), i1 = Math.min(PK.length, Math.ceil(b * PPS));
    cx.fillStyle = '#5c7f9c';
    for (let px = 0; px < W; px++) {
      const s0 = i0 + Math.floor(px / W * (i1 - i0));
      const s1 = i0 + Math.floor((px + 1) / W * (i1 - i0));
      let m = 0;
      for (let i = s0; i < Math.max(s1, s0 + 1); i++) if (PK[i] > m) m = PK[i];
      const h = m / 255 * (H * 0.44);
      cx.fillRect(px, H / 2 - h, 1, h * 2);
    }
  }
  if (r.t_in != null && r.t_in > a && r.t_in < b) {   // apichima: hymn starts after this
    const px = (r.t_in - a) / (b - a) * W;
    cx.fillStyle = 'rgba(216,162,74,.75)';
    for (let y = 0; y < H; y += 9 * devicePixelRatio)
      cx.fillRect(px - devicePixelRatio, y, 2 * devicePixelRatio, 4 * devicePixelRatio);
  }
  const t = A.currentTime;
  if (t >= a && t <= b) {
    cx.fillStyle = '#d8a24a';
    cx.fillRect((t - a) / (b - a) * W - devicePixelRatio, 0, 2 * devicePixelRatio, H);
  }
}
$('#wf').addEventListener('pointerdown', e => {
  const r = rows[sel]; if (!r || r.t0 == null) return;
  const q = e.currentTarget.getBoundingClientRect();
  A.currentTime = r.t0 + Math.max(0, Math.min(1, (e.clientX - q.left) / q.width)) * (r.t1 - r.t0);
  stopAt = r.t1; drawWave();
});
addEventListener('resize', drawWave);
const key = g => `${g.page}:${g.i}`;
const msg = t => $('#msg').textContent = t || '';

async function loadPeaks(k) {
  PK = null;
  try {
    const r = await fetch('/api/peaks/' + encodeURIComponent(k));
    if (!r.ok) throw new Error('peaks ' + r.status);
    PPS = +(r.headers.get('X-Peaks-Per-Second') || 20);
    PK = new Uint8Array(await r.arrayBuffer());
  } catch (e) { msg('waveform unavailable: ' + e.message); }
  drawWave();
}

async function boot() {
  const tapes = await (await fetch('/api/tapes')).json();
  Object.keys(tapes).forEach(k => {
    const o = document.createElement('option'); o.value = k; o.textContent = k;
    $('#wd').append(o);
  });
  $('#wd').onchange = () => load($('#wd').value);
  load(Object.keys(tapes)[0]);
}

async function load(k) {
  wd = k; msg('loading score…');
  D = await (await fetch('/api/score/' + encodeURIComponent(k))).json();
  const saved = Object.fromEntries((D.saved || []).map(c => [c.hymn, c]));
  // Rows are the chanter's audio spans when the tape has been cut: those are
  // the things he can hear, and hymns.json's bounds are what we are fixing.
  if (D.spans && D.spans.length) {
    rows = D.spans.map(sp => {
      const s = saved[sp.hymn];
      return { name: sp.hymn, lane: sp.lane, label: s?.label ?? sp.label ?? null,
               t0: sp.t0, t1: sp.t1, t_in: sp.t_in ?? null,
               p0: s?.p0 ?? null, l0: s?.l0 ?? null, g0: s?.g0 ?? null,
               p1: s?.p1 ?? null, l1: s?.l1 ?? null, g1: s?.g1 ?? null };
    });
  } else {
    rows = D.hymns.map(h => {
      const s = saved[h.name];
      return { name: h.name, hint: [h.p0, h.l0, h.p1, h.l1], t0: null, t1: null,
               p0: s?.p0 ?? null, l0: s?.l0 ?? null, g0: s?.g0 ?? null,
               p1: s?.p1 ?? null, l1: s?.l1 ?? null, g1: s?.g1 ?? null,
               label: s?.label ?? null };
    });
  }
  sel = 0;
  A.src = '/tape/' + encodeURIComponent(k); A.load(); applyRate();
  loadPeaks(k);
  drawPages(); render();
  const n = rows.filter(r => r.t0 != null).length;
  msg(`${D.pages.length} pages · ${D.pages.reduce((a, p) => a + p.glyphs.length, 0)} glyphs · ${n} audio spans`);
}

function drawPages() {
  const box = $('#pages'); box.innerHTML = '';
  D.pages.forEach(p => {
    const d = document.createElement('div'); d.className = 'pg';
    d.innerHTML = `<img loading="lazy" src="/page/${p.page}.jpg" alt="page ${p.page}">` +
                  `<canvas></canvas><span class="pgno">${p.page}</span>`;
    const img = d.querySelector('img'), cv = d.querySelector('canvas');
    img.onload = () => { cv.width = img.naturalWidth; cv.height = img.naturalHeight; paint(p, cv); };
    cv.onclick = e => {
      const r = cv.getBoundingClientRect();
      pick(p, (e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height, cv);
    };
    p._cv = cv; p._img = img;
    box.append(d);
  });
}

// Glyph boxes are in PDF points; the master render is 6 px/point. The book has
// mixed page sizes, so each page also carries a solved dx/dy in MASTER pixels.
// The thumbnail is a straight downscale, so one factor converts both.
function kFor(p, cv) { return cv.width / (p.w || 3498); }        // thumb px per master px
function toPx(p, cv, ptx, pty) {
  const k = kFor(p, cv);
  return [(ptx * 6 + (p.dx || 0)) * k, (pty * 6 + (p.dy || 0)) * k];
}
function toPt(p, cv, px, py) {
  const k = kFor(p, cv);
  return [(px / k - (p.dx || 0)) / 6, (py / k - (p.dy || 0)) / 6];
}

function pick(p, fx, fy, cv) {
  const [px, py] = toPt(p, cv, fx * cv.width, fy * cv.height);
  let best = null, bd = 1e9;
  p.glyphs.forEach(g => {
    const cx = (g.x0 + g.x1) / 2, cy = (g.y0 + g.y1) / 2;
    const inside = px >= g.x0 - 2 && px <= g.x1 + 2 && py >= g.y0 - 4 && py <= g.y1 + 4;
    const d = (px - cx) ** 2 + (py - cy) ** 2;
    if (inside) { if (d < bd) { best = g; bd = d; } }
    else if (best === null && d < bd && d < 900) { bd = d; }
  });
  if (!best) {
    // nothing under the finger: fall back to the nearest glyph on the row
    let nb = null, nd = 1e9;
    p.glyphs.forEach(g => {
      const d = (px - (g.x0 + g.x1) / 2) ** 2 + (py - (g.y0 + g.y1) / 2) ** 2;
      if (d < nd) { nd = d; nb = g; }
    });
    if (nd > 4000) return msg('tap closer to a neume');
    best = nb;
  }
  const r = rows[sel]; if (!r) return;
  if (mode === 0) { r.p0 = p.page; r.l0 = best.l; r.g0 = best.i; }
  else { r.p1 = p.page; r.l1 = best.l; r.g1 = best.i; }
  msg(`${mode === 0 ? 'start' : 'end'}: p${p.page} line ${best.l + 1} unit ${best.i}` +
      ` — ${best.k === 'rest' ? 'rest' : 'base ' + best.k}, ${best.b} beat${best.b === 1 ? '' : 's'}`);
  // once a start is set, the next tap is naturally the end
  if (mode === 0 && r.p1 == null) setMode(1);
  render(); repaintAll(); autosave();
}

function paint(p, cv) {
  const cx = cv.getContext('2d');
  const R = (g) => { const [x0, y0] = toPx(p, cv, g.x0, g.y0),
                           [x1, y1] = toPx(p, cv, g.x1, g.y1);
                     return [x0, y0, x1 - x0, y1 - y0]; };
  cx.clearRect(0, 0, cv.width, cv.height);
  const r = rows[sel]; if (!r) return;
  const at = (pg, l, g) => pg != null && pg === p.page;
  const mark = (l, g, col) => {
    const gl = p.glyphs.find(q => q.i === g); if (!gl) return;
    const [x, y, w, h] = R(gl);
    cx.fillStyle = col;
    cx.fillRect(x - 2, y - 3, w + 4, h + 6);
  };
  // shade everything inside the selected span
  const A = [r.p0, r.l0, r.g0], B = [r.p1, r.l1, r.g1];
  if (r.p0 != null && r.p1 != null) {
    const cmp = (a, b) => a[0] - b[0] || a[1] - b[1] || a[2] - b[2];
    p.glyphs.forEach(g => {
      const c = [p.page, g.l, g.i];
      if (cmp(c, A) >= 0 && cmp(c, B) <= 0) {
        const [x, y, w, h] = R(g);
        cx.fillStyle = 'rgba(216,162,74,.22)';
        cx.fillRect(x - 1, y - 2, w + 2, h + 4);
      }
    });
  }
  if (at(r.p0)) mark(r.l0, r.g0, 'rgba(110,164,95,.55)');
  if (at(r.p1)) mark(r.l1, r.g1, 'rgba(198,91,78,.55)');
}
function repaintAll() { D.pages.forEach(p => { if (p._cv && p._cv.width) paint(p, p._cv); }); }

function render() {
  const L = $('#list'); L.innerHTML = '';
  rows.forEach((r, i) => {
    const done = r.p0 != null && r.p1 != null;
    const d = document.createElement('div');
    d.className = 'h' + (i === sel ? ' sel' : '') + (done ? ' done' : '');
    const esc = t => (t || '').replace(/[<>&]/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]));
    // Show a time-order ordinal. The stored names are identifiers, not
    // positions: "+ span" numbers from #2, and the base row keeps the hymn's
    // own name, so a row called t01_ can sit twentieth on the tape.
    const ord = String(i + 1).padStart(2, '0');
    d.innerHTML = `<span class="n">#${ord} ${esc(r.name)}` +
      `${r.label ? ' — ' + esc(r.label) : ''}</span>` +
      (r.t_in != null ? `<span class="lane-tag">νε</span>` : '') +
      (r.lane ? `<span class="lane-tag">${esc(r.lane)}</span>` : '') +
      `<span class="t">${done ? `p${r.p0}·${r.l0}·${r.g0} → p${r.p1}·${r.l1}·${r.g1}`
        : (r.t0 != null ? `${fmt(r.t1 - r.t0)}` : `hint p${r.hint?.[0]}–${r.hint?.[2]}`)}</span>`;
    d.onclick = () => { sel = i; setMode(0); render(); repaintAll(); drawWave(); };
    L.append(d);
  });
  const r = rows[sel];
  $('#who').textContent = r
    ? `#${String(sel + 1).padStart(2, '0')} of ${rows.length}  ${r.name}` +
      (r.lane ? `  (${r.lane})` : '') : '';
  if ($('#lab').value !== (r?.label || '')) $('#lab').value = r?.label || '';
  // scrollIntoView also scrolls every ANCESTOR scroller, including the
  // document -- which threw the score back to page one on every neume tap.
  // Scroll the row list and nothing else.
  const L2 = $('#list'), el = document.querySelectorAll('.h')[sel];
  if (el) {
    const top = el.offsetTop - L2.offsetTop;
    if (top < L2.scrollTop) L2.scrollTop = top;
    else if (top + el.offsetHeight > L2.scrollTop + L2.clientHeight)
      L2.scrollTop = top + el.offsetHeight - L2.clientHeight;
  }
  drawWave();
}

function setMode(m) {
  mode = m;
  $('#mode0').className = m === 0 ? 'on' : '';
  $('#mode1').className = m === 1 ? 'on' : '';
}
$('#mode0').onclick = () => setMode(0);
$('#mode1').onclick = () => setMode(1);
$('#prev').onclick = () => { sel = Math.max(0, sel - 1); setMode(0); render(); repaintAll(); };
$('#next').onclick = () => { sel = Math.min(rows.length - 1, sel + 1); setMode(0); render(); repaintAll(); };
$('#clr').onclick = () => { const r = rows[sel]; r.p0 = r.l0 = r.g0 = r.p1 = r.l1 = r.g1 = null;
                            setMode(0); render(); repaintAll(); autosave(); };
$('#goto').onclick = () => {
  const r = rows[sel]; const pg = r.p0 ?? r.hint?.[0];
  const el = [...document.querySelectorAll('.pg')][D.pages.findIndex(p => p.page === pg)];
  el?.scrollIntoView({ behavior: 'smooth', block: 'start' });
};
$('#lab').addEventListener('input', e => { rows[sel].label = e.target.value; render(); autosave(); });

let pend = null;
function autosave() { clearTimeout(pend); pend = setTimeout(() => save(true), 1200); }
async function save(quiet) {
  const cuts = rows.filter(r => r.p0 != null && r.p1 != null).map(r => ({
    hymn: r.name, p0: r.p0, l0: r.l0, g0: r.g0, p1: r.p1, l1: r.l1, g1: r.g1,
    label: r.label || null }));
  try {
    const res = await fetch('/api/scorecuts', { method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ workdir: wd, cuts }) });
    const j = await res.json();
    msg(res.ok ? `saved ${j.n}/${rows.length}` + (quiet ? '' : ' → ' + j.path)
               : '✗ ' + (j.error || res.status));
  } catch (e) { msg('✗ ' + e.message); }
}
$('#save').onclick = () => save(false);
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.key === ' ') { e.preventDefault(); $('#pp').click(); }
  else if (e.key === 's') setMode(0);
  else if (e.key === 'e') setMode(1);
  else if (e.key === 'ArrowUp') { e.preventDefault(); $('#prev').click(); }
  else if (e.key === 'ArrowDown') { e.preventDefault(); $('#next').click(); }
});
drawRates();
boot();
</script>
