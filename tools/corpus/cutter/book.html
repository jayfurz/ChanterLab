<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Anastasimatarion</title>
<style>
:root{--bg:#12100e;--panel:#1c1916;--line:#2f2a25;--ink:#efe7dc;--dim:#9c9086;
  --gold:#d8a24a;--red:#c65b4e;--green:#6ea45f;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
header{position:sticky;top:0;z-index:6;background:var(--panel);
  border-bottom:1px solid var(--line);padding:8px 10px;display:flex;gap:6px;align-items:center}
select,button{font:inherit;color:var(--ink);background:#241f1b;
  border:1px solid var(--line);border-radius:9px;padding:8px 11px}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button.on{background:var(--gold);color:#1a1512;border-color:var(--gold);font-weight:600}
button[disabled]{opacity:.38}
header select{flex:1;min-width:0}
header a{color:var(--dim);text-decoration:none;font-size:13px;border:1px solid var(--line);
  border-radius:9px;padding:8px 10px;white-space:nowrap}
main{padding:6px 0 132px}
.sec{max-width:1100px;margin:18px auto 8px;padding:8px 12px;background:var(--panel);
  border:1px solid var(--line);border-radius:9px;color:var(--gold);
  font-weight:600;letter-spacing:.3px}
.sec small{color:var(--dim);font-weight:400;margin-left:8px}
.pg{position:relative;margin:0 auto 10px;max-width:1100px;min-height:120px}
.pg img{display:block;width:100%;height:auto;border-radius:6px;background:#0d0b0a}
.pg canvas{position:absolute;inset:0;width:100%;height:100%}
.pgno{position:absolute;top:4px;right:8px;font-size:12px;color:#000;
  background:rgba(216,162,74,.85);border-radius:4px;padding:1px 6px}
footer{position:fixed;left:0;right:0;bottom:0;background:var(--panel);
  border-top:1px solid var(--line);padding:8px 10px;
  padding-bottom:calc(8px + env(safe-area-inset-bottom));z-index:7}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
.row:first-child{margin-top:0}
.row button{flex:1}
#who{font-size:14px;color:var(--gold);overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;flex:3;min-width:0}
#tl{font-variant-numeric:tabular-nums;font-size:13px;color:var(--dim);flex:0 0 auto}
#msg{font-size:13px;color:var(--dim);min-height:17px}
.rates button{flex:1;min-width:38px;padding:6px 2px;font-size:13px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
#tocp{position:fixed;top:0;left:0;bottom:0;width:min(86vw,360px);z-index:9;
  background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;
  padding:10px 10px calc(20px + env(safe-area-inset-bottom));
  transform:translateX(-102%);transition:transform .18s ease}
#tocp.open{transform:none}
#tocp h3{color:var(--gold);font-size:15px;margin:14px 2px 4px;cursor:pointer}
#tocp h4{color:var(--dim);font-size:13px;margin:8px 2px 3px;cursor:pointer;
  text-transform:capitalize}
#tocp .hy{display:flex;gap:6px;align-items:center;padding:6px 8px;margin:2px 0;
  border:1px solid transparent;border-radius:8px;cursor:pointer;font-size:14px}
#tocp .hy:hover{border-color:var(--line);background:#241f1b}
#tocp .hy.sel{border-color:var(--gold)}
#tocp .hy .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#tocp .hy .pgs{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
#scrub{position:fixed;top:64px;right:0;bottom:150px;width:26px;z-index:8;
  touch-action:none;cursor:grab}
#scrub .track{position:absolute;top:0;bottom:0;right:9px;width:4px;
  background:var(--line);border-radius:2px}
#scrub .thumb{position:absolute;right:2px;width:18px;height:30px;
  background:var(--gold);border-radius:9px;opacity:.85}
body.editing .pg canvas{touch-action:none;cursor:grab}
body.tape #laneM,body.tape #laneP{display:none}
#wmenu{position:fixed;z-index:20;background:var(--panel);border:1px solid var(--gold);
  border-radius:10px;padding:6px;display:none;min-width:150px}
#wmenu button{display:block;width:100%;margin:3px 0;text-align:left}
#wmenu .t{font-size:12px;color:var(--dim);padding:2px 4px}
#armbar{display:none;position:fixed;top:56px;left:50%;transform:translateX(-50%);
  z-index:15;background:var(--gold);color:#1a1512;font-weight:600;
  border-radius:10px;padding:9px 14px;box-shadow:0 2px 10px rgba(0,0,0,.5)}
#armbar button{margin-left:10px;background:#1a1512;color:var(--gold);
  border:none;padding:4px 10px}
#wavep{display:none;background:#0d0b0a;border-top:1px solid var(--line);
  position:relative;height:96px;touch-action:none}
body.tape #wavep{display:block}
#wavep canvas{position:absolute;inset:0;width:100%;height:100%}
#seek{height:14px;position:relative;background:#241f1b;border:1px solid var(--line);
  border-radius:7px;margin-top:6px;cursor:pointer;overflow:hidden}
#seek .fill{position:absolute;left:0;top:0;bottom:0;background:var(--gold);opacity:.55;width:0}
.taperow{display:none}
body.tape .taperow{display:flex}
#scrub .tip{position:absolute;right:30px;transform:translateY(-50%);
  background:var(--gold);color:#1a1512;font-weight:600;font-size:13px;
  border-radius:7px;padding:3px 9px;white-space:nowrap;display:none}
</style>

<header>
  <button id="toc">&#9776;</button>
  <select id="jump"></select>
  <a href="/score">cutter</a>
  <a href="/" id="annroot">annotator</a>
</header>
<audio id="a" preload="none" playsinline webkit-playsinline></audio>
<nav id="tocp"></nav>
<div id="wmenu"></div>
<div id="armbar"><span></span><button>cancel</button></div>
<div id="scrub"><div class="track"></div><div class="thumb"></div><div class="tip"></div></div>
<main id="pages"></main>

<footer>
  <div id="wavep"><canvas></canvas></div>
  <div class="row">
    <span id="who">— tap a green marker to pick a hymn —</span>
    <span id="tl"></span>
  </div>
  <div id="seek"><div class="fill"></div></div>
  <div class="row taperow">
    <button id="tstart">start@play</button>
    <button id="tend">end@play</button>
    <button id="tapx" title="mark where the apichima ends / notes start">apichima@play</button>
    <button id="tzo">−</button>
    <button id="tzi">+</button>
    <button id="tfit">fit</button>
    <button id="tsave">Save cuts</button>
  </div>
  <div class="row">
    <button id="prev">&#8592; prev</button>
    <button id="pp" disabled>Play</button>
    <button id="next">next &#8594;</button>
    <button id="laneM" class="on" title="melos lane: plays the melos recording; in tape mode, start/end/apichima edits apply to the hymn's MELOS span">melos</button>
    <button id="laneP" title="parallagi lane: plays the degree-name recording; in tape mode, start/end/apichima edits apply to the hymn's PARALLAGI span (stored as <name>#par)">parallagi</button>
    <button id="tape" title="play the whole tape; the book follows and spans are editable on the waveform">Tape</button>
    <button id="follow" class="on" title="auto-scroll to the sounding line">follow</button>
  </div>
  <div class="row rates" id="rates"></div>
  <div class="row">
    <button id="edit" disabled>Edit spans</button>
    <button id="newspan" title="map a hymn that has no span yet: name it, then tap its first and last unit in the book">+ span</button>
    <button id="newseg" disabled title="add a DISJUNCT score segment to the selected hymn — lines printed elsewhere that the performance includes (e.g. a shared Doxa/Kai nyn the book prints once)">+ seg</button>
    <button id="undo" disabled title="undo (ctrl+z)">&#8630;</button>
    <button id="redo" disabled title="redo (ctrl+shift+z)">&#8631;</button>
    <button id="fix" disabled>Fix onsets (annotator)</button>
    <button id="parann" title="parallagi overlay: the degree syllable the score implies under each unit of the selected hymn">Para</button>
  </div>
  <div id="msg"></div>
</footer>

<script>
const $ = s => document.querySelector(s);
let B = null;                 // /api/book payload
let sel = -1;                 // index into B.hymns
let det = null;               // /api/book/hymn payload for sel
let rate = 1, stopAt = null, hiGi = -1, follow = true;
let editMode = false, drag = null;
let lane = 'melos';
let paraOn = false;
const DEG_GR = ['νη', 'πα', 'βου', 'γα', 'δι', 'κε', 'ζω'];
const DEG_CAP = ['Ν', 'Π', 'Β', 'Γ', 'Δ', 'Κ', 'Ζ'];   // one cap per degree — all distinct
let armNew = null;   // {wd, name, start:{page,i}|null} while placing a new span                     // which recording of the span plays      // drag: {which:'start'|'end', preview:{pno,u}}
const UC = {};                          // pno -> unit boxes (drag targets)
async function unitsFor(pno) {
  if (UC[pno]) return UC[pno];
  try {
    const r = await fetch('/api/book/units?page=' + pno);
    UC[pno] = r.ok ? await r.json() : [];
  } catch (e) { UC[pno] = []; }
  return UC[pno];
}
const A = $('#a');
const fmt = t => { const m = Math.floor(t / 60), x = t - m * 60;
  return m + ':' + (x < 10 ? '0' : '') + x.toFixed(0).padStart(1, '0'); };
const msg = s => $('#msg').textContent = s || '';

const RATES = [0.5, 0.75, 1, 1.5, 2];
function drawRates() {
  RATES.forEach(r => {
    const b = document.createElement('button');
    b.textContent = r + 'x';
    if (r === 1) b.classList.add('on');
    b.onclick = () => { rate = r; A.playbackRate = r;
      document.querySelectorAll('.rates button').forEach(x => x.classList.toggle('on', x === b)); };
    $('#rates').append(b);
  });
}

/* pages ---------------------------------------------------------------- */
const PG = {};                // pno -> {el,img,cv,meta}
function banners() {
  // "ΗΧΟΣ ΔΕΥΤΕΡΟΣ · orthros" before the first page of each service
  const out = {};
  (B.sections || []).forEach(s => (s.services || []).forEach(sv => {
    out[sv.pdf_pages[0]] = { label: s.label, svc: sv.service };
  }));
  return out;
}
function drawPages() {
  const box = $('#pages'); box.innerHTML = '';
  const ban = banners();
  B.pages.forEach(p => {
    if (ban[p.page]) {
      const d = document.createElement('div'); d.className = 'sec';
      d.id = 'sec' + p.page;
      d.innerHTML = ban[p.page].label + '<small>' + ban[p.page].svc + '</small>';
      box.append(d);
    }
    const d = document.createElement('div'); d.className = 'pg'; d.id = 'p' + p.page;
    d.innerHTML = `<img loading="lazy" src="/page/${p.page}.jpg" alt="page ${p.page}">` +
                  `<canvas></canvas><span class="pgno">${p.page}</span>`;
    const img = d.querySelector('img'), cv = d.querySelector('canvas');
    img.onload = () => { cv.width = img.naturalWidth; cv.height = img.naturalHeight; paint(p.page); };
    img.onerror = () => { img.style.minHeight = '120px'; };
    cv.onclick = e => {
      if (drag && drag.moved) return;     // the click that ends a drag
      const r = cv.getBoundingClientRect();
      pick(p.page, (e.clientX - r.left) / r.width * cv.width,
                   (e.clientY - r.top) / r.height * cv.height);
    };
    cv.onpointerdown = e => {
      if (!editMode || sel < 0) return;
      const h = B.hymns[sel];
      const r = cv.getBoundingClientRect();
      const px = (e.clientX - r.left) / r.width * cv.width;
      const py = (e.clientY - r.top) / r.height * cv.height;
      for (const which of ['par_start', 'par_end', 'start', 'end']) {
        const b = h[which];
        if (!b || b.p !== p.page) continue;
        const m = markBox(p.page, b, 14);
        if (m && px >= m[0] && px <= m[0] + m[2] && py >= m[1] && py <= m[1] + m[3]) {
          e.preventDefault();
          drag = { which, preview: null, moved: false };
          unitsFor(p.page);
          const WORD = { start: 'GREEN melos start', end: 'RED melos end',
            par_start: 'blue PARALLAGI start', par_end: 'blue PARALLAGI end' };
          msg('dragging the ' + WORD[which] +
              ' — release on the unit it belongs on');
          return;
        }
      }
    };
    PG[p.page] = { el: d, img, cv, meta: p };
    box.append(d);
  });
}
/* glyph boxes are PDF points; masters are 6 px/pt with a per-page solved
   dx/dy in master px; thumbs are straight downscales of the master */
function toPx(pno, x, y) {
  const g = PG[pno]; if (!g) return null;
  const k = g.cv.width / (g.meta.w || 3498);
  return [(x * 6 + (g.meta.dx || 0)) * k, (y * 6 + (g.meta.dy || 0)) * k];
}
function toPt(pno, px, py) {
  const g = PG[pno]; if (!g) return null;
  const k = g.cv.width / (g.meta.w || 3498);
  return [(px / k - (g.meta.dx || 0)) / 6, (py / k - (g.meta.dy || 0)) / 6];
}
function markBox(pno, b, grow) {
  const p0 = toPx(pno, b.x0, b.y0), p1 = toPx(pno, b.x1, b.y1);
  if (!p0) return null;
  const g = grow || 0;
  return [p0[0] - g, p0[1] - g, p1[0] - p0[0] + 2 * g, p1[1] - p0[1] + 2 * g];
}
function paint(pno) {
  const g = PG[pno]; if (!g || !g.cv.width) return;
  const cx = g.cv.getContext('2d');
  cx.clearRect(0, 0, g.cv.width, g.cv.height);
  B.hymns.forEach((h, i) => {
    const isSel = i === sel;
    if (h.start.p === pno) {
      const r = markBox(pno, h.start, 4); if (r) {
        cx.fillStyle = h.audio || h.t0 != null ?
          'rgba(110,164,95,.42)' : 'rgba(140,140,140,.32)';
        cx.fillRect(...r);
        cx.strokeStyle = isSel ? '#d8a24a' : '#6ea45f';
        cx.lineWidth = isSel ? 5 : 2.5; cx.strokeRect(...r);
        cx.font = Math.round(g.cv.width / 55) + 'px system-ui';
        cx.fillStyle = isSel ? '#d8a24a' : 'rgba(110,164,95,.95)';
        cx.fillText(h.name + (h.label ? ' — ' + h.label : ''), r[0], Math.max(r[1] - 8, 20));
      }
    }
    if (h.end.p === pno) {
      const r = markBox(pno, h.end, 4); if (r) {
        cx.fillStyle = 'rgba(198,91,78,.42)'; cx.fillRect(...r);
        cx.strokeStyle = isSel ? '#d8a24a' : '#c65b4e';
        cx.lineWidth = isSel ? 5 : 2.5; cx.strokeRect(...r);
      }
    }
    // disjunct segments: mark the interior joints so the jump is visible
    (h.segs || []).forEach((sg, k) => {
      if (!sg) return;
      const marks = [];
      if (k > 0 && sg.start.p === pno) marks.push(sg.start);
      if (k < h.segs.length - 1 && sg.end.p === pno) marks.push(sg.end);
      marks.forEach(b => { const r = markBox(pno, b, 5); if (!r) return;
        cx.setLineDash([4, 4]);
        cx.strokeStyle = isSel ? '#d8a24a' : '#b0955f';
        cx.lineWidth = 3; cx.strokeRect(...r); cx.setLineDash([]);
        cx.fillStyle = '#b0955f';
        cx.font = Math.round(g.cv.width / 75) + 'px system-ui';
        cx.fillText('seg ' + (k + 1), r[0], Math.max(r[1] - 3, 11)); });
    });
    // the parallagi's own score range, when it differs from the melos
    if (h.par_start && h.par_start.p === pno) {
      const r = markBox(pno, h.par_start, 7); if (r) {
        cx.setLineDash([6, 4]);
        cx.strokeStyle = isSel ? '#d8a24a' : '#5f8ea4';
        cx.lineWidth = isSel ? 4 : 2.5; cx.strokeRect(...r); cx.setLineDash([]);
        cx.fillStyle = '#8aa3c8';
        cx.font = Math.round(g.cv.width / 70) + 'px system-ui';
        cx.fillText('par', r[0], Math.max(r[1] - 4, 12));
      }
    }
    if (h.par_end && h.par_end.p === pno) {
      const r = markBox(pno, h.par_end, 7); if (r) {
        cx.setLineDash([6, 4]);
        cx.strokeStyle = isSel ? '#d8a24a' : '#a45f6e';
        cx.lineWidth = isSel ? 4 : 2.5; cx.strokeRect(...r); cx.setLineDash([]);
      }
    }
  });
  // parallagi overlay: degree syllables under the selected hymn's units.
  // The parallagi is READ LEFT TO RIGHT, always — but the unit stream is in
  // SUNG order, and kentimata figures print right of the note they precede.
  // So per line: degrees stay in stream order, positions are the same units'
  // boxes sorted by x — left-to-right reading spells the sung sequence.
  // One shared baseline per line, bold dark text with a halo (the thin light
  // blue at box-bottom height failed both ordering and accessibility).
  if (paraOn && det && det.degrees && sel >= 0) {
    cx.font = 'bold ' + Math.round(g.cv.width / 48) + 'px system-ui';
    cx.textAlign = 'center';
    const byLine = {};
    for (let i = 0; i < det.units.length; i++) {
      const u = det.units[i];
      if (u.p !== pno || det.degrees[i] == null) continue;
      (byLine[u.l] = byLine[u.l] || []).push(i);
    }
    for (const l of Object.keys(byLine)) {
      const idxs = byLine[l];                       // stream order
      const boxes = idxs.map(i => markBox(pno, det.units[i], 0))
                        .filter(Boolean);
      if (boxes.length !== idxs.length) continue;
      const base = Math.max(...boxes.map(b => b[1] + b[3])) +
                   16 * (g.cv.width / 1100);
      const xs = boxes.map(b => b[0] + b[2] / 2).sort((a, b) => a - b);
      // compound figures (a note and its kentimata) print at almost the same
      // x, stacking their letters — enforce a minimum gap, preserving order
      const gap = Math.round(g.cv.width / 48) * 1.05;
      for (let k = 1; k < xs.length; k++)
        if (xs[k] < xs[k - 1] + gap) xs[k] = xs[k - 1] + gap;
      idxs.forEach((i, k) => {
        const s = DEG_CAP[((det.degrees[i] % 7) + 7) % 7];
        cx.lineWidth = 4; cx.strokeStyle = 'rgba(255,255,255,.9)';
        cx.strokeText(s, xs[k], base);
        cx.fillStyle = i === hiGi ? '#8a5a00' : '#1c3a5e';
        cx.fillText(s, xs[k], base);
      });
    }
    cx.textAlign = 'start';
  }
  // drag preview: where the marker would land
  if (drag && drag.preview && drag.preview.pno === pno) {
    const u = drag.preview.u;
    const r = markBox(pno, u, 5);
    if (r) { cx.setLineDash([7, 5]);
      cx.strokeStyle = drag.which === 'start' ? '#6ea45f' : '#c65b4e';
      cx.lineWidth = 5; cx.strokeRect(...r); cx.setLineDash([]); }
  }
  // playback highlight
  if (det && hiGi >= 0 && det.units[hiGi] && det.units[hiGi].p === pno) {
    const r = markBox(pno, det.units[hiGi], 5);
    if (r) { cx.fillStyle = 'rgba(216,162,74,.5)'; cx.fillRect(...r);
             cx.strokeStyle = '#d8a24a'; cx.lineWidth = 3; cx.strokeRect(...r); }
  }
}
function repaintAll() { Object.keys(PG).forEach(p => paint(+p)); }

/* selection ------------------------------------------------------------ */
async function pick(pno, px, py) {
  if (armNew) return placeNew(pno, px, py);
  let best = -1, bd = 1e9;
  B.hymns.forEach((h, i) => {
    [h.start, h.end].forEach(b => {
      if (b.p !== pno) return;
      const r = markBox(pno, b, 10); if (!r) return;
      const cx0 = r[0] + r[2] / 2, cy0 = r[1] + r[3] / 2;
      const d = (px - cx0) ** 2 + (py - cy0) ** 2;
      const inside = px >= r[0] && px <= r[0] + r[2] && py >= r[1] && py <= r[1] + r[3];
      if (inside && d < bd) { bd = d; best = i; }
    });
  });
  if (best >= 0) return select(best, false);
  // No marker under the tap: select the hymn whose SCORE contains the point.
  // Reading order is (page, line-y, x); lines stack, so a lexicographic
  // compare with a same-line tolerance on y is the span test.
  const pt = toPt(pno, px, py); if (!pt) return;
  const LINE = 12;   // pt: treat y within this as the same text line
  const cmp = (p1, y1, x1, p2, y2, x2) => {
    if (p1 !== p2) return p1 - p2;
    if (Math.abs(y1 - y2) > LINE) return y1 - y2;
    return x1 - x2;
  };
  let inBest = -1, bestStart = null;
  B.hymns.forEach((h, i) => {
    // a segmented hymn contains a point only inside one of its SEGMENTS —
    // the envelope between segments is other hymns' territory (the aposticha
    // theotokion's gap holds the whole dogmatic theotokion)
    const ranges = h.segs ? h.segs.filter(Boolean).map(s => [s.start, s.end])
                          : [[h.start, h.end]];
    for (const [a, b] of ranges) {
      if (pno < a.p || pno > b.p) continue;
      if (cmp(pno, pt[1], pt[0], a.p, a.y0, a.x0) < 0) continue;
      if (cmp(pno, pt[1], pt[0], b.p, b.y1, b.x1) > 0) continue;
      // overlapping candidates: keep the one whose containing range starts latest
      if (inBest < 0 || cmp(a.p, a.y0, a.x0,
          bestStart.p, bestStart.y0, bestStart.x0) >= 0) {
        inBest = i; bestStart = a;
      }
      break;
    }
  });
  if (inBest >= 0) select(inBest, false);
}
let selSeq = 0;
async function select(i, scroll, keepAudio) {
  if (i < 0 || i >= B.hymns.length) return;
  if (!keepAudio) stop();
  sel = i; det = null; hiGi = -1;
  const seq = ++selSeq;
  const h = B.hymns[i];
  $('#who').innerHTML = `<span class="dot" style="background:${
    h.audio ? 'var(--green)' : h.t0 != null ? 'var(--gold)' : '#777'}"></span>` +
    `${h.wd} · ${h.name}` + (h.label ? ` — ${h.label}` : '') + (h.genus ? ` · ${h.genus}` : '');

function tapeSpanOf(t) {
  if (!TP) return null;
  for (const [name, s] of Object.entries(TP.spans))
    if (s.t0 != null && s.t1 != null && t >= s.t0 && t < s.t1) return name;
  return null;
}
function normalizeSpan(s) {
  if (s.t0 == null || s.t1 == null) return;
  if (s.t_in != null && (s.t_in < s.t0 || s.t_in > s.t1)) {
    s.t_in = null; msg('apichima mark fell outside the span — cleared (unsaved)');
  }
  s.skips = (s.skips || [])
    .map(iv => [Math.max(iv[0], s.t0), Math.min(iv[1], s.t1)])
    .filter(iv => iv[1] - iv[0] > 0.05);
}
function selectedTapeSpan() {
  if (!TP) { msg('enter Tape mode first'); return null; }
  // a +span in progress owns the marks: they land on the NEW hymn's row
  if (armNew && armNew.wd === TP.wd) {
    const k = armNew.name;
    return TP.spans[k] || (TP.spans[k] = { t0: null, t1: null, t_in: null,
      label: null, lane: null, skips: [] });
  }
  if (sel < 0) { msg('select a hymn first (or start a + span)'); return null; }
  const h = B.hymns[sel];
  if (h.wd !== TP.wd) {
    msg(`${h.name} is not on this tape (${TP.wd}) — select a hymn from this tape`);
    return null;
  }
  // Both lanes live on the tape at once. Marks land on, in order:
  //   1. the selected hymn's span under the playhead
  //   2. its missing melos row (created)
  //   3. its missing parallagi row (created)
  // NEVER on an existing span the playhead is outside of — that once moved a
  // saved melos span when the chanter meant to add the parallagi. Existing
  // spans move only by dragging their own edges.
  const t = A.currentTime;
  const mk = () => ({ t0: null, t1: null, t_in: null, label: null,
                      lane: null, skips: [] });
  for (const k of [h.name, h.name + '#par']) {
    const s = TP.spans[k];
    if (s && s.t0 != null && s.t1 != null && t >= s.t0 && t < s.t1) {
      TP.markKey = k; return s;
    }
  }
  if (!TP.spans[h.name] || TP.spans[h.name].t0 == null) {
    TP.markKey = h.name;
    return TP.spans[h.name] || (TP.spans[h.name] = mk());
  }
  const pk = h.name + '#par';
  if (!TP.spans[pk] || TP.spans[pk].t0 == null) {
    TP.markKey = pk;
    return TP.spans[pk] || (TP.spans[pk] = { ...mk(), lane: 'parallagi' });
  }
  msg(`${h.name} already has melos + parallagi spans — drag an edge to move ` +
      'one, or play inside a span to re-mark it');
  return null;
}
function spanAt(tapeT) {
  let best = null;
  for (const [name, s] of Object.entries(TP.spans))
    if (s.t0 != null && s.t1 != null && tapeT >= s.t0 && tapeT <= s.t1)
      if (!best || s.t1 - s.t0 < TP.spans[best].t1 - TP.spans[best].t0) best = name;
  return best;
}
function openWaveMenu(name, cx, cy) {
  const M = $('#wmenu'), s = TP.spans[name];
  const par = spanIsPar(name, s), base = spanBase(name);
  M.innerHTML = `<div class="t">${base}${par ? ' · parallagi' : ' · melos'}</div>`;
  const add = (label, fn) => { const b = document.createElement('button');
    b.textContent = label; b.onclick = () => { M.style.display = 'none';
      const c = tapeSnap(label); fn(); c(); };
    M.append(b); };
  if (par) add('→ mark as MELOS', () => {
    if (TP.spans[base]) return msg(`${base} already has a melos span`);
    TP.spans[base] = { ...s, lane: 'melos' };
    delete TP.spans[name];
    TP.dirty = true; needWave = true; msg(`${base}: span is now melos (unsaved)`);
  });
  else add('→ mark as PARALLAGI', () => {
    const k = base + '#par';
    if (TP.spans[k]) return msg(`${base} already has a parallagi span`);
    TP.spans[k] = { ...s, lane: 'parallagi' };
    delete TP.spans[name];
    TP.dirty = true; needWave = true; msg(`${base}: span is now parallagi (unsaved)`);
  });
  const hasRow = B.hymns.some(h => h.wd === TP.wd && h.name === base);
  const arm = (isPar) => {
    armNew = { wd: TP.wd, name: base, start: null, scoreOnly: true,
               par: isPar, replace: !isPar && hasRow };
    armBar(`${base}${isPar ? ' (parallagi)' : ' (melos)'}: tap its FIRST unit on the score`);
    msg(`${base}: scroll the book and tap its FIRST unit`);
  };
  add(`▤ place MELOS score span${hasRow ? ' (re-place)' : ''}`, () => arm(false));
  add(`▤ place PARALLAGI score span`, () => arm(true));
  add('✕ delete this span', () => {
    delete TP.spans[name];
    TP.dirty = true; needWave = true; msg(`${base}: span deleted (unsaved — Save cuts to persist)`);
  });
  add('cancel', () => {});
  M.style.display = 'block';
  M.style.left = Math.min(cx, innerWidth - 180) + 'px';
  M.style.top = Math.max(10, cy - M.offsetHeight - 10) + 'px';
}
function initWave() {
  const P = $('#wavep'), cv = P.querySelector('canvas');
  let press = null, pressAt = null;       // long-press timer (iPad has no right-click)
  document.addEventListener('pointerdown', e => {
    if (!$('#wmenu').contains(e.target)) $('#wmenu').style.display = 'none';
  }, true);
  P.addEventListener('contextmenu', e => {
    if (!TP) return; e.preventDefault();
    const name = spanAt(x2t(px(e), cv.width));
    if (name) openWaveMenu(name, e.clientX, e.clientY);
  });
  const px = e => { const r = P.getBoundingClientRect();
    return (e.clientX - r.left) * (cv.width || r.width) / r.width; };
  const pts = new Map();
  P.addEventListener('pointerdown', e => {
    if (!TP) return;
    P.setPointerCapture(e.pointerId);
    pts.set(e.pointerId, e.clientX);
    clearTimeout(press);
    const lpX = e.clientX, lpY = e.clientY;
    pressAt = [lpX, lpY];
    press = setTimeout(() => {
      if (!TP || pts.size !== 1) return;
      const name = spanAt(x2t(px({ clientX: lpX }), cv.width));
      if (name) { wdrag = null; openWaveMenu(name, lpX, lpY); }
    }, 600);
    if (pts.size > 1) { wdrag = { kind: 'pinch' }; return; }
    const W = cv.width, x = px(e), tol = 10 * devicePixelRatio;
    wdrag = { kind: 'pan', x0: x, v: [...TP.view], moved: false };
    for (const [name, s] of Object.entries(TP.spans)) {
      if (s.t0 == null) continue;
      if (Math.abs(t2x(s.t0, W) - x) < tol) wdrag = { kind: 'edge', name, edge: 't0' };
      else if (Math.abs(t2x(s.t1, W) - x) < tol) wdrag = { kind: 'edge', name, edge: 't1' };
      else if (s.t_in != null && Math.abs(t2x(s.t_in, W) - x) < tol)
        wdrag = { kind: 'edge', name, edge: 't_in' };
      if (wdrag.kind === 'edge') {
        wdrag.commit = tapeSnap(`${wdrag.edge} of ${name}`);
        const i = B.hymns.findIndex(h => h.wd === TP.wd && h.name === spanBase(name));
        if (i >= 0 && i !== sel) select(i, false, true);
        break;
      }
    }
  });
  P.addEventListener('pointermove', e => {
    if (!TP || !wdrag) return;
    pts.set(e.pointerId, e.clientX);
    if (pressAt && Math.hypot(e.clientX - pressAt[0], e.clientY - pressAt[1]) > 8)
      clearTimeout(press);
    const W = cv.width, x = px(e);
    if (wdrag.kind === 'pinch' && pts.size >= 2) {
      const [a, b] = [...pts.values()];
      if (wdrag.d0 == null) { wdrag.d0 = Math.abs(a - b); wdrag.v = [...TP.view];
        wdrag.mid = x2t((Math.min(a, b) + Math.abs(a - b) / 2 -
          P.getBoundingClientRect().left) * devicePixelRatio, W); return; }
      const k = Math.max(0.05, wdrag.d0 / Math.max(10, Math.abs(a - b)));
      const w = (wdrag.v[1] - wdrag.v[0]) * k;
      const Dz = tpDur() || wdrag.v[1];
      TP.view = [Math.max(0, wdrag.mid - w / 2),
                 Math.min(Dz, wdrag.mid + w / 2)];
      needWave = true; return;
    }
    if (wdrag.kind === 'edge') {
      const D = tpDur();
      if (!D) { msg('tape duration unknown — edits disabled until it loads'); return; }
      const s = TP.spans[wdrag.name], t = Math.max(0, Math.min(D, x2t(x, W)));
      if (wdrag.edge === 't0') s.t0 = Math.min(t, (s.t1 ?? D) - 0.5);
      else if (wdrag.edge === 't1') s.t1 = Math.max(t, (s.t0 ?? 0) + 0.5);
      else s.t_in = Math.max(s.t0 ?? 0, Math.min(s.t1 ?? D, t));
      normalizeSpan(s);
      TP.dirty = true; needWave = true;
      msg(`${wdrag.name} ${wdrag.edge} → ${fmt(wdrag.edge === 't0' ? s.t0 :
          wdrag.edge === 't1' ? s.t1 : s.t_in)} (unsaved)`);
      return;
    }
    // pan
    const dt = (wdrag.x0 - x) / W * (wdrag.v[1] - wdrag.v[0]);
    if (Math.abs(wdrag.x0 - x) > 6 * devicePixelRatio) wdrag.moved = true;
    const Dp = tpDur() || wdrag.v[1];
    let v0 = wdrag.v[0] + dt, v1 = wdrag.v[1] + dt;
    if (v0 < 0) { v1 -= v0; v0 = 0; }
    if (v1 > Dp) { v0 -= v1 - Dp; v1 = Dp; }
    TP.view = [Math.max(0, v0), Math.min(Dp, v1)]; needWave = true;
  });
  const up = e => {
    clearTimeout(press);
    pts.delete(e.pointerId);
    if (!wdrag) return;
    if (wdrag.kind === 'edge' && wdrag.commit) wdrag.commit();
    if (wdrag.kind === 'pan' && !wdrag.moved && TP)
      A.currentTime = x2t(px(e), cv.width);
    if (wdrag.kind === 'pinch' || pts.size === 0) wdrag = null;
    needWave = true;
  };
  P.addEventListener('pointerup', up); P.addEventListener('pointercancel', up);
  P.addEventListener('wheel', e => {
    if (!TP) return; e.preventDefault();
    const W = cv.width, mid = x2t(px(e), W);
    const k = e.deltaY > 0 ? 1.3 : 1 / 1.3;
    const Dw = tpDur() || TP.view[1];
    TP.view = [Math.max(0, mid - (mid - TP.view[0]) * k),
               Math.min(Dw, mid + (TP.view[1] - mid) * k)];
    if (TP.view[1] - TP.view[0] < 2) TP.view = [mid - 1, mid + 1];
    needWave = true;
  }, { passive: false });
  (function loop() { if (tapeMode && TP && (needWave || !A.paused))
      { drawWave(); needWave = false; }
    requestAnimationFrame(loop); })();
}
async function saveCuts() {
  if (!TP) return;
  const cuts = Object.entries(TP.spans)
    .filter(([, s]) => s.t0 != null && s.t1 != null)
    .map(([name, s]) => ({ hymn: name, t0: +s.t0.toFixed(2), t1: +s.t1.toFixed(2),
      label: s.label,
      lane: s.lane || (name.includes('#par') ? 'parallagi' : null),
      t_in: s.t_in == null ? null : +s.t_in.toFixed(2),
      skips: s.skips || [] }));
  msg('saving cuts…');
  try {
    const r = await fetch('/api/cuts', { method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ workdir: TP.wd, cuts }) });
    const out = await r.json();
    if (!r.ok || out.error) throw new Error(out.error || r.status);
    TP.dirty = false; TAPES = null; tapesIndex();
    B.hymns.forEach(h => {
      if (h.wd !== TP.wd) return;
      const s = TP.spans[h.name] || TP.spans[h.name + '#par'];
      if (s && s.t0 != null) { h.t0 = s.t0; h.t1 = s.t1; }
    });
    msg(`saved ${cuts.length} spans for ${TP.wd}`);
  } catch (e) { msg('save failed: ' + e.message); }
}

/* header jump ---------------------------------------------------------- */
function drawJump() {
  const s = $('#jump');
  const o = (v, t) => { const e = document.createElement('option');
    e.value = v; e.textContent = t; s.append(e); };
  o('', 'jump to…');
  (B.sections || []).forEach(sec => (sec.services || []).forEach(sv =>
    o('sec' + sv.pdf_pages[0], sec.label + ' — ' + sv.service)));
  s.onchange = () => { const el = document.getElementById(s.value);
    if (el) el.scrollIntoView({ block: 'start' }); s.value = ''; };
}

/* table of contents ---------------------------------------------------- */
function drawToc() {
  const p = $('#tocp'); p.innerHTML = '';
  const go = el => { $('#tocp').classList.remove('open'); el?.scrollIntoView({ block: 'start' }); };
  (B.sections || []).forEach(sec => {
    const h3 = document.createElement('h3'); h3.textContent = sec.label;
    h3.onclick = () => go(document.getElementById('sec' + (sec.services?.[0]?.pdf_pages[0] ?? sec.pdf_pages[0])) ||
                          PG[sec.pdf_pages[0]]?.el);
    p.append(h3);
    (sec.services || []).forEach(sv => {
      const h4 = document.createElement('h4');
      h4.textContent = sv.service + ' — p.' + sv.pdf_pages[0] + '–' + sv.pdf_pages[1];
      h4.onclick = () => go(document.getElementById('sec' + sv.pdf_pages[0]) || PG[sv.pdf_pages[0]]?.el);
      p.append(h4);
      B.hymns.forEach((h, i) => {
        const pos = h.ord || h.start;
        if (pos.p < sv.pdf_pages[0] || pos.p > sv.pdf_pages[1]) return;
        const d = document.createElement('div'); d.className = 'hy'; d.dataset.i = i;
        d.innerHTML = `<span class="dot" style="background:${
          h.audio ? 'var(--green)' : h.t0 != null ? 'var(--gold)' : '#777'}"></span>` +
          `<span class="n">${h.name}${h.label ? ' — ' + h.label : ''}</span>` +
          `<span class="pgs">${pos.p}${h.end.p !== pos.p ? '–' + h.end.p : ''}</span>`;
        d.onclick = () => { $('#tocp').classList.remove('open'); select(i); };
        p.append(d);
      });
    });
  });
  const orphans = B.hymns.filter(h => { const pos = h.ord || h.start;
    return !(B.sections || []).some(sec => (sec.services || []).some(sv =>
      pos.p >= sv.pdf_pages[0] && pos.p <= sv.pdf_pages[1])); });
  if (orphans.length) {
    const h3 = document.createElement('h3'); h3.textContent = 'other'; p.append(h3);
    orphans.forEach(h => {
      const i = B.hymns.indexOf(h);
      const d = document.createElement('div'); d.className = 'hy'; d.dataset.i = i;
      d.innerHTML = `<span class="n">${h.wd} · ${h.label || h.name}</span>` +
                    `<span class="pgs">${h.start.p}</span>`;
      d.onclick = () => { $('#tocp').classList.remove('open'); select(i); };
      p.append(d);
    });
  }
}
function tocMark() {
  document.querySelectorAll('#tocp .hy').forEach(el =>
    el.classList.toggle('sel', +el.dataset.i === sel));
}

/* page scrubber: drag the right edge to fly through the book ------------ */
function initScrub() {
  const S = $('#scrub'), thumb = S.querySelector('.thumb'), tip = S.querySelector('.tip');
  const pnos = B.pages.map(p => p.page);
  const frac2p = f => pnos[Math.max(0, Math.min(pnos.length - 1, Math.round(f * (pnos.length - 1))))];
  let drag = false;
  const at = e => {
    const r = S.getBoundingClientRect();
    const y = (e.touches ? e.touches[0].clientY : e.clientY) - r.top;
    return Math.max(0, Math.min(1, y / r.height));
  };
  const jump = e => {
    const f = at(e), pno = frac2p(f);
    tip.style.top = (f * 100) + '%'; tip.style.display = 'block';
    tip.textContent = 'p. ' + pno;
    thumb.style.top = 'calc(' + (f * 100) + '% - 15px)';
    PG[pno]?.el.scrollIntoView({ block: 'start' });
  };
  S.addEventListener('pointerdown', e => { drag = true; S.setPointerCapture(e.pointerId); jump(e); });
  S.addEventListener('pointermove', e => { if (drag) jump(e); });
  const end = () => { drag = false; tip.style.display = 'none'; };
  S.addEventListener('pointerup', end); S.addEventListener('pointercancel', end);
  // keep the thumb tracking normal scroll too
  document.addEventListener('scroll', () => {
    if (drag) return;
    const f = document.documentElement.scrollTop /
      Math.max(1, document.documentElement.scrollHeight - innerHeight);
    thumb.style.top = 'calc(' + (f * 100) + '% - 15px)';
  }, { passive: true });
}

/* boot ----------------------------------------------------------------- */
async function boot() {
  drawRates();
  B = await (await fetch('/api/book')).json();
  drawPages(); drawJump(); drawToc(); initScrub();
  $('#toc').onclick = () => $('#tocp').classList.toggle('open');
  $('#pp').onclick = playPause;
  $('#prev').onclick = () => select(sel < 0 ? 0 : Math.max(0, sel - 1));
  $('#next').onclick = () => select(sel < 0 ? 0 : Math.min(B.hymns.length - 1, sel + 1));
  $('#follow').onclick = () => { follow = !follow; $('#follow').classList.toggle('on', follow); };
  initWave();
  $('#newspan').onclick = startNewSpan;
  $('#newseg').onclick = startNewSeg;
  $('#armbar button').onclick = () => { if (armNew && !armNew.scoreOnly)
      delete TP?.spans?.[armNew.name];
    armNew = null; needWave = true; armBar(null); msg('+ span cancelled'); };
  const setLane = l => {
    lane = l;
    $('#laneM').classList.toggle('on', l === 'melos');
    $('#laneP').classList.toggle('on', l === 'parallagi');
    if (!tapeMode && !A.paused) { stop(); playPause(); }   // switch mid-play
    else if (tapeMode) msg(l + ' lane — span edits now apply to the ' + l + ' span');
    needWave = true;
  };
  $('#laneM').onclick = () => setLane('melos');
  $('#laneP').onclick = () => setLane('parallagi');
  $('#tape').onclick = async () => {
    tapeMode = !tapeMode;
    $('#tape').classList.toggle('on', tapeMode);
    document.body.classList.toggle('tape', tapeMode);
    if (tapeMode) {
      let ok = false;
      try { ok = await enterTape(sel >= 0 ? B.hymns[sel].wd : null); }
      catch (e) { msg('tape unavailable: ' + e.message); }
      if (!ok || !TP) {
        tapeMode = false;
        $('#tape').classList.remove('on');
        document.body.classList.remove('tape');
      }
    } else {
      if (TP && TP.dirty) {
        if (confirm('You have UNSAVED cut edits on this tape. Save them before leaving tape mode?')) {
          await saveCuts();
        } else if (!confirm('Discard the unsaved cut edits?')) {
          tapeMode = true;
          $('#tape').classList.add('on');
          document.body.classList.add('tape');
          return;
        }
      }
      stop(); TP = null; A.removeAttribute('src'); A.load(); msg('');
    }
  };
  window.addEventListener('beforeunload', e => {
    if (tapeMode && TP && TP.dirty) { e.preventDefault(); e.returnValue = ''; }
  });
  $('#tstart').onclick = () => { const s = selectedTapeSpan(); if (!s) return;
    const c = tapeSnap('start mark');
    s.t0 = +A.currentTime.toFixed(2); if (s.t1 == null || s.t1 <= s.t0) s.t1 = s.t0 + 30;
    normalizeSpan(s); c(); TP.dirty = true; needWave = true;
    msg(`start set on ${TP.markKey || 'span'} (unsaved)`); };
  $('#tend').onclick = () => { const s = selectedTapeSpan(); if (!s) return;
    const c = tapeSnap('end mark');
    s.t1 = +A.currentTime.toFixed(2); if (s.t0 == null || s.t0 >= s.t1) s.t0 = Math.max(0, s.t1 - 30);
    normalizeSpan(s); c(); TP.dirty = true; needWave = true;
    msg(`end set on ${TP.markKey || 'span'} (unsaved)`); };
  $('#tapx').onclick = () => { const s = selectedTapeSpan(); if (!s) return;
    const c = tapeSnap('apichima mark');
    s.t_in = s.t_in == null ? +A.currentTime.toFixed(2) : null;
    c(); TP.dirty = true; needWave = true;
    msg(s.t_in == null ? 'apichima mark cleared (unsaved)' : 'apichima end marked (unsaved)'); };
  $('#undo').onclick = doUndo; $('#redo').onclick = doRedo;
  $('#tzi').onclick = () => { const D = tpDur(); if (!TP || !D) return;
    const [v0, v1] = TP.view, m = (v0 + v1) / 2,
    w = Math.max(2, (v1 - v0) / 1.6); TP.view = [Math.max(0, m - w / 2), Math.min(D, m + w / 2)]; needWave = true; };
  $('#tzo').onclick = () => { const D = tpDur(); if (!TP || !D) return;
    const [v0, v1] = TP.view, m = (v0 + v1) / 2,
    w = Math.min(D, (v1 - v0) * 1.6); TP.view = [Math.max(0, m - w / 2), Math.min(D, m + w / 2)]; needWave = true; };
  $('#tfit').onclick = () => { const D = tpDur(); if (TP && D) { TP.view = [0, D]; needWave = true; } };
  $('#tsave').onclick = saveCuts;
  $('#seek').addEventListener('pointerdown', e => {
    const r = $('#seek').getBoundingClientRect();
    const f = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
    if (A.duration) A.currentTime = f * A.duration;
  });
  $('#edit').onclick = () => {
    editMode = !editMode;
    $('#edit').classList.toggle('on', editMode);
    document.body.classList.toggle('editing', editMode);
    msg(editMode ? 'edit mode: drag the green start or red end of the selected hymn'
                 : '');
  };
  $('#fix').onclick = () => { const h = B.hymns[sel]; if (h && h.piece)
    location.href = `/?piece=${encodeURIComponent(h.piece)}`; };
  $('#parann').onclick = () => {
    paraOn = !paraOn;
    $('#parann').classList.toggle('on', paraOn);
    if (paraOn && det && !det.degrees) msg('no degree stream for this hymn (no anchor found)');
    repaintAll();
  };
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'SELECT') return;
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
      e.preventDefault(); return e.shiftKey ? doRedo() : doUndo();
    }
    if (e.code === 'Space') { e.preventDefault(); playPause(); }
    if (e.key === 'ArrowLeft' || e.key === 'j') $('#prev').click();
    if (e.key === 'ArrowRight' || e.key === 'k') $('#next').click();
  });
  msg(`${B.hymns.length} spans · ${B.pages.length} pages`);
  const q = new URLSearchParams(location.search);
  if (q.get('wd') && q.get('hymn')) {
    const i = B.hymns.findIndex(h => h.wd === q.get('wd') && h.name === q.get('hymn'));
    if (i >= 0) select(i);
  }
}
boot();
